name: Instance transfer interop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache vendored dependencies
        uses: actions/cache@v4
        with:
          path: |
            CMCLauncher/libs
            CMCLauncher/src/main/jniLibs
            CMCLauncher/src/main/assets/runtimes
            CMCLauncher/src/main/assets/app_runtime
            CMCLauncher/src/main/assets/components
            LWJGL/3.3.3/libs
            LWJGL/3.4.1/libs
            LWJGL/compileOnly
            Terracotta/src/main/jniLibs
          key: vendored-${{ hashFiles('gradle/vendored-deps.json') }}
      - name: Checkout desktop launcher
        uses: actions/checkout@v4
        with:
          repository: CMCLauncher-Dev/CMCLauncher
          path: desktop

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Build desktop sender harness
        run: |
          mkdir -p harness
          cat > harness/harness.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../desktop/CMCLauncher.Core/CMCLauncher.Core.csproj" />
            </ItemGroup>
          </Project>
          EOF
          cat > harness/Program.cs <<'EOF'
          using CMCLauncher;

          var root = Path.Combine(Path.GetTempPath(), "interop-store");
          var store = new Store(root);
          var instance = new Instance
          {
              Name = "Interop",
              GameVersion = "1.20.1",
              Loader = "fabric",
              LoaderVersion = "0.15.0",
              StorageRoot = store.MinecraftRoot,
          };
          store.Config.Instances.Add(instance);
          await store.Save();

          var game = store.GameDirectory(instance);
          Directory.CreateDirectory(Path.Combine(game, "saves", "interop"));
          Directory.CreateDirectory(Path.Combine(game, "mods"));
          File.WriteAllText(Path.Combine(game, "saves", "interop", "level.dat"), "level");
          File.WriteAllText(Path.Combine(game, "mods", "interop.jar"), "mod");
          File.WriteAllText(Path.Combine(game, "options.txt"), "lang:zh_cn");

          using var cancel = new CancellationTokenSource(TimeSpan.FromMinutes(8));
          var selection = new InstanceTransfer.Selection(
              instance,
              new[] { "saves", "mods", "options.txt" }
          );
          await InstanceTransfer.Send(
              store,
              new[] { selection },
              false,
              (address, code) =>
              {
                  var port = address.Split(' ')[0].Split(':').Last();
                  var endpoint = "127.0.0.1:" + port;
                  File.WriteAllText("/tmp/interop-sender.txt", endpoint + "\n" + code);
                  Console.WriteLine("READY " + endpoint);
              },
              cancel.Token,
              (address, code, token) => Task.FromResult(true)
          );
          Console.WriteLine("DONE");
          EOF
          dotnet build harness/harness.csproj -c Release

      - name: Start desktop sender
        run: |
          rm -f /tmp/interop-sender.txt
          nohup dotnet run --project harness/harness.csproj -c Release --no-build > /tmp/interop-sender.log 2>&1 &
          for i in $(seq 1 90); do
            if [ -s /tmp/interop-sender.txt ]; then break; fi
            sleep 1
          done
          cat /tmp/interop-sender.log
          test -s /tmp/interop-sender.txt
          {
            echo "CMC_INTEROP_ADDR=$(sed -n 1p /tmp/interop-sender.txt)"
            echo "CMC_INTEROP_CODE=$(sed -n 2p /tmp/interop-sender.txt)"
          } >> "$GITHUB_ENV"

      - name: Receive with launcher under test
        run: |
          chmod +x gradlew
          ./gradlew :CMCLauncher:testDebugUnitTest --tests 'com.cmc.launcher.game.transfer.InstanceTransferReceiverTest' -Darch=arm64 --stacktrace --no-daemon

      - name: Upload interop results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-results
          path: |
            CMCLauncher/build/reports/tests/
            CMCLauncher/build/test-results/
            /tmp/interop-sender.log
          retention-days: 14
          if-no-files-found: warn