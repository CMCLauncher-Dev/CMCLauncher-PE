name: Build Android APK

on:
  push:
    branches: [main, codex/ui-refactor]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ARM64 Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: '25.2.9519653'
      BUILD_TOOLS_VERSION: '36.0.0'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "platforms;android-37.2" "platforms;android-37.0" \
            "build-tools;$BUILD_TOOLS_VERSION" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Rust for PetLib
        run: |
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Assemble debug APK
        run: bash ./gradlew :CMCLauncher:assembleDebug -Darch=arm64 --no-daemon --stacktrace

      - name: Verify APK signature and PetLib
        run: |
          shopt -s nullglob
          apks=(CMCLauncher/build/outputs/apk/debug/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected one ARM64 debug APK, found ${#apks[@]}."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify "${apks[0]}"
          unzip -Z1 "${apks[0]}" | grep -Fx 'lib/arm64-v8a/libpetlib.so'

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: cmclauncher-pe-debug-arm64
          path: CMCLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
